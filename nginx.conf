server
{
    listen 80;
    listen 443 ssl http2;
    server_name dhpg8.duckdns.org;

    index index.html index.htm default.htm default.html;
    root /www/wwwroot/agent/frontend/dist;

    include /www/server/panel/vhost/nginx/extension/dhpg8.duckdns.org/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/dhpg8.duckdns.org.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    #error_page 404/404.html;

    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    ssl_certificate     /www/server/panel/vhost/cert/dhpg8.duckdns.org/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dhpg8.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256;

    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 497 https://$host$request_uri;

    #SSL-END

    # ===========================
    # Go API
    # ===========================
    location /api/v1/ {

        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffering off;
    }

    # ===========================
    # WebSocket
    # ===========================
    location /ws/ {

        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering off;
    }

    # ===========================
    # 上传目录
    # ===========================
    location /uploads/ {

        alias /www/wwwroot/agent/uploads/;

        expires 30d;

        add_header Cache-Control "public,max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # ===========================
    # Vue SPA
    # ===========================
    location / {

        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache,no-store,must-revalidate";
    }

    #ERROR-PAGE-START
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/html_dhpg8.duckdns.org.conf;
    #REWRITE-END

    # 禁止访问敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradle|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.idea|\.ssh|\.github|node_modules|runtime)/ {
        return 404;
    }

    # Let's Encrypt
    location ~ \.well-known {
        allow all;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # 图片缓存
    location ~* \.(gif|jpg|jpeg|png|bmp|ico|svg|webp)$ {
        expires 30d;
        access_log off;
    }

    # JS/CSS缓存
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 12h;
        access_log off;
    }

    access_log /www/wwwlogs/dhpg8.duckdns.org.log;
    error_log  /www/wwwlogs/dhpg8.duckdns.org.error.log;
}
